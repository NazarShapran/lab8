services:
  api:
    build:
      context: .
      dockerfile: Lectures.Api/Dockerfile
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=lectures_db;Username=postgres;Password=postgres

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=lectures_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5